server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fintech
    static_configs:
      - targets: [localhost]
        labels:
          job: fintech
          __path__: /var/log/fintech/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: "2006-01-02T15:04:05Z0700"
          fallback_formats: ["2006-01-02T15:04:05-0700"]
