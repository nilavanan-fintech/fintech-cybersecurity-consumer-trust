version: 1
disable_existing_loggers: false
formatters:
  json:
    (): src.common.JsonFormatter
  console:
    format: "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    stream: ext://sys.stdout
  file:
    # filename is rewritten at runtime to $FINTECH_LOG_DIR/fintech.log (shipped to Loki by Promtail)
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/fintech.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf-8
root:
  level: INFO
  handlers: [console, file]
